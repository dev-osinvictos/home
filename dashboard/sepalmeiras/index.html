<script>
/* ===== CORE: movimento, socket, física e AI analyze ===== */
const socket = io("https://sepalmeiras.onrender.com", {
  transports: ["websocket", "polling"],
  reconnection: true,
  reconnectionAttempts: Infinity,
  reconnectionDelay: 2000,
});
window.socket = socket;

// === Utilitário: throttle ===
function throttle(fn, delay) {
  let last = 0;
  return (...args) => {
    const now = Date.now();
    if (now - last >= delay) {
      last = now;
      fn(...args);
    }
  };
}

const circles = {};
const dragState = {};
let activeId = null;

// === Inicializa círculos (jogadores) ===
for (let i = 1; i <= 24; i++) {
  const el = document.getElementById("circle" + i);
  circles[i] = el;
  dragState[i] = { dragging: false, offsetX: 0, offsetY: 0 };
  if (!el) continue;
  el.style.position = el.style.position || "absolute";
  el.style.zIndex = "20";

  el.addEventListener("mousedown", (e) => {
    dragState[i].dragging = true;
    dragState[i].offsetX = e.offsetX;
    dragState[i].offsetY = e.offsetY;
    activeId = i;
  });

  el.addEventListener("touchstart", (e) => {
    const touch = e.touches[0];
    const rect = el.getBoundingClientRect();
    dragState[i].dragging = true;
    dragState[i].offsetX = touch.clientX - rect.left;
    dragState[i].offsetY = touch.clientY - rect.top;
    activeId = i;
    e.preventDefault();
  }, { passive: false });
}

// === Física da bola ===
const emitBallMove = throttle((id, left, top) => {
  socket.emit("ball-move", { id, left, top });
}, 50);

const ball = document.getElementById("circle24");

// === Detecção de colisão ===
function checkCollision(playerEl, ballEl) {
  const pr = playerEl.getBoundingClientRect();
  const br = ballEl.getBoundingClientRect();
  const dx = pr.left - br.left;
  const dy = pr.top - br.top;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < 30;
}

/* ===== MOVIMENTO, COLISÃO E FÍSICA AVANÇADA (FIFA MODE) ===== */

let lastSpoken = {}; // cooldown das falas
let ballVelocity = { x: 0, y: 0 }; // vetor de velocidade da bola
let ballMoving = false;

// === Função de movimento e impacto ===
function moveElement(id, x, y) {
  const el = circles[id];
  if (!el) return;

  // 🟥 impede o juiz (circle12) de movimentar a bola ou ter impacto
  if (id === 12) return;

  // 🟢 permite o movimento da bola localmente
  const oldX = parseFloat(el.style.left || 0);
  const oldY = parseFloat(el.style.top || 0);

  el.style.left = x + "px";
  el.style.top = y + "px";

  // Se for a bola, apenas emite o movimento e sai (sem colisão)
  if (id === 24) {
    emitBallMove("circle24", x, y);
    return;
  }

  // detecta colisão jogador-bola
  if (checkCollision(el, ball)) {
    const now = Date.now();

    // fala uma vez por segundo
    if (!lastSpoken[id] || now - lastSpoken[id] > 1000) {
      speakPlayerNumber("circle" + id);
      lastSpoken[id] = now;
    }

    // === Cálculo do impacto proporcional à velocidade ===
    const vx = (x - oldX) * 0.6; // força (ajuste: 0.6–1.0)
    const vy = (y - oldY) * 0.6;
    ballVelocity.x = vx;
    ballVelocity.y = vy;
    ballMoving = true;
  }
}

// === Loop de física (inércia e atrito) ===
function updateBallPhysics() {
  if (!ballMoving) return;

  const ball = document.getElementById("circle24");
  if (!ball) return;

  let bx = parseFloat(ball.style.left || 0);
  let by = parseFloat(ball.style.top || 0);

  // aplica velocidade
  bx += ballVelocity.x;
  by += ballVelocity.y;

  // atrito (reduz a velocidade gradualmente)
  ballVelocity.x *= 0.94;
  ballVelocity.y *= 0.94;

  // se a velocidade for muito baixa, para a bola
  if (Math.abs(ballVelocity.x) < 0.05 && Math.abs(ballVelocity.y) < 0.05) {
    ballMoving = false;
  }

  // mantém dentro do campo (limites de tela)
  const field = document.getElementById("field") || document.body;
  const maxX = (field.clientWidth || window.innerWidth) - 40;
  const maxY = (field.clientHeight || window.innerHeight) - 40;
  bx = Math.max(0, Math.min(bx, maxX));
  by = Math.max(0, Math.min(by, maxY));

  // aplica posição
  ball.style.left = bx + "px";
  ball.style.top = by + "px";

  // envia posição ao servidor
  emitBallMove("circle24", bx, by);
}

// === Atualiza a física a cada frame ===
setInterval(updateBallPhysics, 30);

// === Movimento dos jogadores (desktop + touch) ===
const emitPlayerMove = throttle((id, left, top) => {
  socket.emit("player-move", { id, left, top });
}, 50);

document.addEventListener("mousemove", (e) => {
  if (!activeId) return;
  const i = activeId;
  const x = e.clientX - dragState[i].offsetX;
  const y = e.clientY - dragState[i].offsetY;
  moveElement(i, x, y);
  emitPlayerMove("circle" + i, x, y);
});

document.addEventListener("touchmove", (e) => {
  if (!activeId) return;
  const i = activeId;
  const touch = e.touches[0];
  const x = touch.clientX - dragState[i].offsetX;
  const y = touch.clientY - dragState[i].offsetY;
  moveElement(i, x, y);
  emitPlayerMove("circle" + i, x, y);
  e.preventDefault();
}, { passive: false });

function endDrag() {
  if (activeId) {
    dragState[activeId].dragging = false;
    activeId = null;
  }
}
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);

// === Recebe posições dos jogadores de outros clientes ===
socket.on("update_circle", (data) => {
  const el = document.getElementById("circle" + data.id);
  if (el) {
    el.style.left = data.left + "px";
    el.style.top = data.top + "px";
  }
});


const canvas = document.getElementById("trace-canvas");
const ctx = canvas?.getContext("2d", { willReadFrequently: true });

  // === RECEBE DESENHOS DE OUTROS USUÁRIOS ===
  if (window.socket) {
    socket.on("path_draw", (data) => {
      if (!data || !Array.isArray(data.path)) return;
      const rect = canvas.getBoundingClientRect();

      // Reconstrói coordenadas reais conforme o tamanho do canvas local
      const scaled = data.path.map(([nx, ny]) => [nx * rect.width, ny * rect.height]);

      // Cor por camada tática
      const color = data.layer === "defesa" 
        ? "rgba(51,153,255,0.9)"
        : data.layer === "bolaparada"
        ? "rgba(255,215,0,0.9)"
        : "rgba(255,51,51,0.9)"; // ataque padrão

      // Desenha suavizado e aplica fade local
      ctx.beginPath();
      ctx.moveTo(scaled[0][0], scaled[0][1]);
      for (let i = 1; i < scaled.length - 1; i++) {
        const xc = (scaled[i][0] + scaled[i + 1][0]) / 2;
        const yc = (scaled[i][1] + scaled[i + 1][1]) / 2;
        ctx.quadraticCurveTo(scaled[i][0], scaled[i][1], xc, yc);
      }
      ctx.lineTo(scaled[scaled.length - 1][0], scaled[scaled.length - 1][1]);
      ctx.strokeStyle = color;
      ctx.shadowColor = color.replace("0.9", "0.3");
      ctx.shadowBlur = 6;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.closePath();

      // 🔥 fade automático em 5s (sincronizado visualmente)
      setTimeout(() => {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.globalAlpha = 0.15;
        ctx.beginPath();
        ctx.moveTo(scaled[0][0], scaled[0][1]);
        for (let i = 1; i < scaled.length - 1; i++) {
          const xc = (scaled[i][0] + scaled[i + 1][0]) / 2;
          const yc = (scaled[i][1] + scaled[i + 1][1]) / 2;
          ctx.quadraticCurveTo(scaled[i][0], scaled[i][1], xc, yc);
        }
        ctx.lineTo(scaled[scaled.length - 1][0], scaled[scaled.length - 1][1]);
        ctx.stroke();
        ctx.closePath();
        ctx.restore();
      }, 5000);
    });
  }

  function animateTeam(prefix, positions) {
    for (const p of positions) {
      if (p.id === 23) continue;
      const el = document.getElementById(prefix + p.id);
      if (el) {
        el.style.transition = 'left 1s ease, top 1s ease';
        el.style.left = p.left + 'px';
        el.style.top = p.top + 'px';
      }
    }
  }

// === 🟢 BLOCO TÁTICO DINÂMICO (MOVE O TIME TODO) ===
function applyDynamicBlocks(greenPlayers, phase, opponentFormation) {
  let blockOffsetX = 0;
  switch ((phase || "").toLowerCase()) {
    case "ataque":    blockOffsetX = -80; break;
    case "defesa":    blockOffsetX =  80; break;
    case "transicao": blockOffsetX = -40; break;
  }
  if (opponentFormation === "4-4-2" || opponentFormation === "5-4-1") blockOffsetX = -100;
  else if (opponentFormation === "4-3-3" || opponentFormation === "4-2-3-1") blockOffsetX = 100;

  console.log(`🟢 Bloco aplicado: fase=${phase}, offset=${blockOffsetX}px`);

  greenPlayers.forEach(p => {
    const el = document.getElementById(`circle${p.id}`);
    if (!el) return;
    const newX = p.left + blockOffsetX;
    el.style.left = `${Math.max(20, Math.min(580, newX))}px`;
    el.style.top  = `${p.top}px`;
    p.left = Math.max(20, Math.min(580, newX));
  });
}

// === Função: envia imagem do campo para análise visual (IA Vision) ===
async function sendVisionTactic() {
  try {
    const canvas = document.querySelector("canvas");
    if (!canvas) {
      console.warn("❌ Canvas não encontrado.");
      return;
    }

    const fieldImage = canvas.toDataURL("image/png");
    const possession = typeof getCurrentPossession === "function"
      ? getCurrentPossession()
      : "verde";

    const ball = typeof getBall === "function" ? getBall() : null;

    console.log("📸 Enviando imagem do campo para análise visual...");
    console.log("🖼️ fieldImage:", fieldImage.substring(0, 100));

    const green = getPalmeirasPositions();
    const black = getOpponentPositions();

    const res = await fetch("https://sepalmeiras.onrender.com/ai/vision-tactic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fieldImage, possession, ball, green, black })
    });

    const data = await res.json();
    console.log("📊 Visão Tática (backend):", data);

    // ✅ Move o Palmeiras pela visão da IA
    if (Array.isArray(data.green) && data.green.length > 0) {
      animateTeam("circle", data.green);

      applyDynamicBlocks(
        data.green,
        data.phase?.toLowerCase() || "defesa",
        data.opponentFormation || "4-4-2"
      );
    }

    // ✅ Abre popup do treinador
    if (data.coachComment && typeof showAbelCommentPopup === "function") {
      showAbelCommentPopup(data.coachComment);
    }
    
    return data;
  } catch (err) {
    console.error("❌ Erro ao enviar imagem para IA Vision:", err);
  }
}
</script> 

<script>
// ==== Constantes do campo (mantém igual ao backend) ====
const FIELD_WIDTH = 600;
const FIELD_HEIGHT = 300;

// === Funções auxiliares ===
function makeVisionSnapshot() {
  const cw = 600, ch = 300;         // mesmo FIELD_WIDTH/HEIGHT do servidor
  const off = document.createElement("canvas");
  off.width = cw; off.height = ch;
  const g = off.getContext("2d");

  // === Campo básico ===
  g.fillStyle = "#2e7d32"; g.fillRect(0,0,cw,ch);         // gramado
  g.strokeStyle = "#ffffff"; g.lineWidth = 2;
  g.strokeRect(1,1,cw-2,ch-2);                             // linhas externas
  g.beginPath(); g.moveTo(cw/2,0); g.lineTo(cw/2,ch); g.stroke(); // linha do meio
  g.beginPath(); g.arc(cw/2, ch/2, 46, 0, Math.PI*2); g.stroke(); // círculo central

  // === Áreas (simplificadas) ===
  g.strokeRect(0, 75, 60, 150);                            // grande esquerda
  g.strokeRect(cw-60, 75, 60, 150);                        // grande direita
  g.strokeRect(0, 100, 20, 100);                           // pequena esquerda
  g.strokeRect(cw-20, 100, 20, 100);                       // pequena direita

  // === Coleta posições atuais ===
  const green = getPalmeirasPositions();
  const black = getOpponentPositions();
  const ball  = getBall();

  // === Desenha ADVERSÁRIO (preto) ===
  g.fillStyle = "#111111";
  g.strokeStyle = "#ffffff";
  for (const p of black) {
  const invertedX = FIELD_WIDTH - (p.left - 20);  // ✅ agora p existe dentro do loop
  g.beginPath();
  g.arc(invertedX, p.top - 20, 13, 0, Math.PI * 2);
  g.fill();
  g.stroke();
}

  // === Desenha PALMEIRAS (verde claro) ===
  g.fillStyle = "#33FFCC";
  for (const p of green) {
    g.beginPath(); g.arc(p.left - 20, p.top - 20, 13, 0, Math.PI*2); g.fill();
  }

  // === Desenha BOLA ===
  g.fillStyle = "#ffffff";
  g.beginPath(); g.arc(ball.left - 20, ball.top - 20, 6, 0, Math.PI*2); g.fill();

  return off.toDataURL("image/png");
}

function getOpponentPositions() {

}

}

// === Detecta posse de bola considerando lado do campo ===
// Palmeiras defende à DIREITA e ataca à ESQUERDA
function detectBallPossession(green, black, ball) {
  const field = document.getElementById('background-square');
  const rect = field.getBoundingClientRect();

  // Normaliza coordenadas para [0..FIELD_WIDTH]
  const bx = (ball.left - rect.left);
  const cx = rect.width / 2;

  // Distâncias mínimas
  const dGreen = Math.min(...green.map(p => Math.hypot(p.left - ball.left, p.top - ball.top)));
  const dBlack = Math.min(...black.map(p => Math.hypot(p.left - ball.left, p.top - ball.top)));

  // Peso leve pelo lado do campo (Palmeiras ataca da direita->esquerda)

<script>
/* ===== Desenho Tático: correção para offset mobile (HiDPI + CSS size sync) ===== */
(function(){
  const canvas = document.getElementById("trace-canvas");
  const penBtn = document.getElementById("pen-path-btn");
  const socket = window.socket || (window.io ? io() : null);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  // Faz o canvas ocupar um tamanho CSS estável (se quiser, ajuste aqui)
  // Se preferir que o canvas seja responsivo, ajuste o CSS; aqui usamos o rect atual.
  function resizeCanvasForDisplay() {
    const ratio = window.devicePixelRatio || 1;
    // pega o tamanho CSS real do canvas (dependendo do layout)
    const rect = canvas.getBoundingClientRect();

    // forçar CSS width/height para o tamanho do rect (garante consistência)
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    // ajusta o buffer físico do canvas para HiDPI
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);

    // faz o ctx trabalhar em CSS pixels (transforma coords automaticamente)
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  // chama no load e quando a viewport muda
  resizeCanvasForDisplay();
  window.addEventListener('resize', resizeCanvasForDisplay);
  // também quando há rolagem (às vezes rect muda por UI do navegador)
  window.addEventListener('scroll', () => {
    // atualização leve — só se o canvas estiver visível
    resizeCanvasForDisplay();
  }, { passive: true });

  // estado
  let penMode = false;
  let drawing = false;
  let currentPath = [];
  let pointerId = null;

  // Toggle pen button: ativa/desativa captura de eventos
  penBtn.addEventListener('click', () => {
    penMode = !penMode;
    penBtn.style.background = penMode ? "#33aaff" : "#222";
    canvas.style.pointerEvents = penMode ? "auto" : "none";
    penBtn.textContent = penMode ? "✎ Desenhando..." : "✎ Desenho Tático";
    if (penMode) {
      canvas.style.zIndex = "1000";
    } else {
      canvas.style.zIndex = "1";
    }
  });

  // evita scroll durante desenho
  canvas.style.touchAction = "none";

  // converte evento -> coordenada em CSS pixels relativa ao canvas
  function getCoordFromEvent(evt) {
    const rect = canvas.getBoundingClientRect();
    // pointer events: clientX/clientY
    if (evt.clientX !== undefined && evt.clientY !== undefined) {
      return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }
    // touch fallback
    if (evt.touches && evt.touches[0]) {
      return { x: evt.touches[0].clientX - rect.left, y: evt.touches[0].clientY - rect.top };
    }
    return { x: 0, y: 0 };
  }

  // pointer events (recomendado)
  canvas.addEventListener('pointerdown', (e) => {
    if (!penMode || !e.isPrimary) return;
    drawing = true;
    pointerId = e.pointerId;
    try { canvas.setPointerCapture(pointerId); } catch (er) {}
    const { x, y } = getCoordFromEvent(e);
    currentPath = [[x, y]];
    ctx.beginPath();
    ctx.moveTo(x, y);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!penMode || !drawing || e.pointerId !== pointerId) return;
    const { x, y } = getCoordFromEvent(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#ff3333";
    ctx.lineWidth = 4;
    ctx.stroke();
    currentPath.push([x, y]);
  });

  function finishDrawing(e) {
    if (!drawing) return;
    drawing = false;
    try { canvas.releasePointerCapture(pointerId); } catch (er) {}
    ctx.closePath();
    if (socket && currentPath.length > 1) {
      socket.emit('path_draw', { path: currentPath });
    }

    setTimeout(() => {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.globalAlpha = 1.0;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }, 4000);

    currentPath = [];
    pointerId = null;
  }

  canvas.addEventListener('pointerup', finishDrawing);
  canvas.addEventListener('pointercancel', finishDrawing);
  canvas.addEventListener('pointerout', (e) => {
    if (drawing && e.pointerId === pointerId) finishDrawing(e);
  });

  // touch fallback (mantém compatibilidade)
  canvas.addEventListener('touchstart', (e) => {
    if (!penMode) return;
    e.preventDefault();
    const c = getCoordFromEvent(e);
    drawing = true;
    currentPath = [[c.x, c.y]];
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (!penMode || !drawing) return;
    e.preventDefault();
    const c = getCoordFromEvent(e);
    ctx.lineTo(c.x, c.y);
    ctx.strokeStyle = "#ff3333";
    ctx.lineWidth = 4;
    ctx.stroke();
    currentPath.push([c.x, c.y]);
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!penMode || !drawing) return;
    e.preventDefault();
    drawing = false;
    ctx.closePath();

    if (socket && currentPath.length > 1) socket.emit('path_draw', { path: currentPath });
    setTimeout(() => {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.globalAlpha = 1.0;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }, 4000);

    currentPath = [];
  }, { passive: false });

  // recebe e desenha paths de outros clientes (coord em CSS pixels)
  if (socket) {
    socket.on('path_draw', (data) => {
      if (!data || !Array.isArray(data.path) || data.path.length === 0) return;
      ctx.beginPath();
      for (let i = 0; i < data.path.length; i++) {
        const [x, y] = data.path[i];
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "#ff3333";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.closePath();
      setTimeout(() => {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.globalAlpha = 1.0;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }, 4000);
    });
  }
})();
</script>

}
