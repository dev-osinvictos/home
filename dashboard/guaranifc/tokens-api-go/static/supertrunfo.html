<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Super-Trunfo NFT — OS INVICTOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
  </script>

  <style>
    body {
      background: #0c1d2b;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 { text-align:center; }

    .box {
      background: #111;
      border: 1px solid #333;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 400px;
    }

    button {
      width: 100%; padding: 12px;
      border: none; border-radius: 8px;
      background: #28a745; color: white;
      font-size: 16px; cursor: pointer;
      margin-top: 10px;
    }

    select, input {
      width: 100%; padding: 10px;
      border-radius: 6px; border: none;
      margin-bottom: 10px;
    }

    model-viewer {
      width: 100%;
      height: 350px;
      background: #000;
      border-radius: 10px;
    }

    #resultado {
      white-space: pre-line;
      margin-top: 15px;
      padding: 10px;
      background: #222;
      border-radius: 8px;
      border: 1px solid #444;
    }
  </style>
</head>

<body>
  <h1>🃏 Super-Trunfo NFT — OS INVICTOS</h1>

  <div class="box">
    <h3>1) Escolha seu treinador</h3>
    <select id="card"></select>

    <h3>2) Categoria da disputa</h3>
    <select id="attr">
      <option value="champions">🏆 Títulos conquistados</option>
      <option value="teams">👔 Times comandados</option>
      <option value="major_title_year">📅 Título mais antigo</option>
    </select>

    <h3>3) Visualização 3D</h3>
    <model-viewer id="viewer"
      src=""
      auto-rotate
      camera-controls>
    </model-viewer>

    <button id="btn-play">Enviar jogada</button>

    <div id="resultado"></div>
  </div>

  <script>
    let TRAINERS = [];
    let ws;

    // =============================
    // 1) Carregar lista NFT do Go
    // =============================
    async function loadCards() {
      const res = await fetch("/api/nft/trainers");
      const data = await res.json();
      TRAINERS = data.cards;

      const sel = document.getElementById("card");
      TRAINERS.forEach(t => {
        const op = document.createElement("option");
        op.value = t.id;
        op.textContent = t.name;
        sel.appendChild(op);
      });

      updateGLB();
    }

    // Atualizar GLB quando seleciona card
    document.getElementById("card").onchange = updateGLB;
    function updateGLB(){
      const id = Number(document.getElementById("card").value);
      const card = TRAINERS.find(t => t.id === id);
      if (card) {
        document.getElementById("viewer").src = card.glb_model;
      }
    }

    // =============================
    // 2) WebSocket com o Go
    // =============================
    function connectWS() {
      ws = new WebSocket("wss://" + window.location.host + "/ws/supertrunfo");

      ws.onopen = () => {
        console.log("WS conectado");
      };

      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        console.log("Resultado:", data);

        document.getElementById("resultado").textContent =
          `🎮 Resultado\n\n` +
          `Categoria: ${data.attr}\n` +
          `Vencedor: ${data.winner}\n\n` +
          `Você jogou: ${data.p1.card.name}\n` +
          `Oponente jogou: ${data.p2.card.name}\n`;
      };

      ws.onerror = (e) => console.error("WS erro", e);
      ws.onclose = () => console.warn("WS fechado");
    }

    // =============================
    // 3) Enviar jogada
    // =============================
    document.getElementById("btn-play").onclick = () => {
      const id = Number(document.getElementById("card").value);
      const card = TRAINERS.find(t => t.id === id);

      const play = {
        room: "1234", // depois substituímos pelo PIN real
        player: "usuario-demo@ct.com",
        attr: document.getElementById("attr").value,
        card
      };

      ws.send(JSON.stringify(play));

      document.getElementById("resultado").textContent =
        "⏳ Aguardando o adversário...";
    };

    loadCards();
    connectWS();
  </script>
</body>
</html>
